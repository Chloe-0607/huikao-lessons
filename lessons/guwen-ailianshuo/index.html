<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>愛蓮說｜互動國文講義</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<!-- ===== ENGINE:STYLE START｜共用樣式，單篇講義不要改這一段；要改請改 templates/guwen.html 再執行 tools/check.py --sync ===== -->
<style>
:root{
  --paper:#f5f1e8; --card:#fffdfa; --ink:#292621; --sub:#6f675f; --line:#ded5c7;
  --seal:#ad4c3f; --ok:#3f7457; --ng:#a8473e;
  --main:#4f7180; --deep:#314d58; --soft:#e5eef0; --gold:#c3944c;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;overflow-x:hidden}
a{color:var(--deep)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 18px}

/* Hero */
.hero{position:relative;overflow:hidden;padding:28px 0 40px;border-bottom:1px solid var(--line)}
.hero .back{display:inline-flex;align-items:center;min-height:44px;font-size:14px;color:var(--sub);text-decoration:none}
.hero .back:hover{color:var(--deep)}
.hero .eyebrow{margin:18px 0 6px;font-size:13px;letter-spacing:.48em;color:var(--main);font-weight:700}
.hero h1{position:relative;z-index:1;margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(42px,9vw,66px);line-height:1.2;color:var(--deep);letter-spacing:.06em}
.hero .byline{position:relative;z-index:1;margin:10px 0 18px;font-family:var(--serif);color:var(--sub);letter-spacing:.08em}
.hero .lead{position:relative;z-index:1;max-width:36em;margin:0;color:var(--ink)}
.hero .mark{position:absolute;right:-10px;top:-24px;font-family:var(--serif);font-weight:900;font-size:clamp(170px,40vw,320px);line-height:1;color:var(--main);opacity:.08;pointer-events:none;user-select:none}

/* Sticky controls */
.controls{position:sticky;top:0;z-index:20;background:rgba(245,241,232,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.controls .wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;font-size:15px}
.toggle .dot{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.toggle .dot::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
.toggle[aria-pressed="true"] .dot{background:var(--main)}
.toggle[aria-pressed="true"] .dot::after{left:14px}
.controls .score{margin-left:auto;font-size:14px;color:var(--sub);white-space:nowrap}
.controls .score b{color:var(--deep);font-size:16px}

/* Section head */
.sec{margin:56px 0}
.sec-head{margin-bottom:22px}
.sec-head .kicker{font-size:12px;letter-spacing:.24em;color:var(--main);font-weight:700}
.sec-head h2{margin:2px 0 8px;font-family:var(--serif);font-weight:700;font-size:clamp(24px,5vw,30px);line-height:1.4;color:var(--deep)}
.sec-head .rule{height:1px;background:linear-gradient(90deg,var(--main),rgba(0,0,0,0))}
.sec-head p{margin:12px 0 0;color:var(--sub)}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 18px;margin-bottom:16px}
.num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--main);color:#fff;font-size:14px;font-weight:700;flex:none}
.bg-card{border-left:6px solid var(--seal)}
.facts{display:grid;grid-template-columns:7em 1fr;gap:6px 14px;margin:0}
.facts dt{color:var(--sub);font-size:14px;padding-top:2px}
.facts dd{margin:0}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 4px;padding:14px 16px;background:var(--soft);border-radius:6px}
.chain .step{font-weight:700;color:var(--deep)}
.chain .arrow{color:var(--gold);font-weight:700}
.quote{margin:18px 0 0;padding:6px 0 6px 18px;border-left:3px solid var(--gold);font-family:var(--serif);font-size:20px;line-height:1.7;color:var(--deep)}
.quote small{display:block;margin-top:4px;font-family:var(--sans);font-size:14px;color:var(--sub)}

/* Text */
.para-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:var(--sub);font-size:14px}
.src{font-family:var(--serif);font-size:21px;line-height:2.25;letter-spacing:.04em;margin:0}
/* 直式注音：寫在字的右側，聲調放在注音右邊（臺灣課本慣例） */
ruby{display:inline-flex;align-items:center;vertical-align:baseline}
ruby rt{display:inline-flex;align-items:center;margin:0 .06em 0 .05em;font-family:var(--sans);font-size:.52em;line-height:1;color:var(--sub);letter-spacing:0;font-weight:400}
ruby rt .zy-b{writing-mode:vertical-rl;text-orientation:upright;line-height:1.02}
ruby rt .zy-t{margin-left:.04em;line-height:1}
body.no-zhuyin ruby rt{display:none}
.annot{background:none;border:0;padding:0;margin:0;font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;border-bottom:1.5px dotted var(--main);line-height:inherit}
.annot:hover,.annot[aria-expanded="true"]{background:var(--soft)}
.tr-btn{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);cursor:pointer;font-size:14px;color:var(--deep)}
.tr-list{display:none;margin:12px 0 0;border-top:1px solid var(--line)}
.tr-list.open{display:block}
.tr-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 18px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tr-src{font-family:var(--serif);color:var(--deep)}
.tr-txt{color:var(--ink)}
#pop{position:fixed;z-index:50;max-width:min(320px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-top:3px solid var(--main);border-radius:6px;box-shadow:0 8px 24px rgba(41,38,33,.14);padding:12px 14px;font-size:15px;line-height:1.7;display:none}
#pop.show{display:block}
#pop b{display:block;font-family:var(--serif);color:var(--deep);font-size:17px;margin-bottom:2px}

/* Tables & notes */
.table-box{margin-bottom:18px}
.table-box h3,.subhead{margin:0 0 10px;font-family:var(--serif);font-size:19px;color:var(--deep)}
.data-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:15px}
.data-table th,.data-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.data-table th{background:var(--soft);color:var(--deep);font-weight:700;white-space:nowrap}
.data-table td:first-child{font-family:var(--serif);font-weight:700;color:var(--deep)}
.note,.trap{border-radius:6px;padding:14px 16px;margin:0 0 14px;font-size:15px}
.note{background:var(--soft);border-left:4px solid var(--main)}
.trap{background:#f7ebe7;border-left:4px solid var(--seal)}
.note b.t,.trap b.t{display:block;margin-bottom:2px;color:var(--deep)}
.trap b.t{color:var(--seal)}

/* Explore */
.explore-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px;font-size:14px;color:var(--sub)}
.explore-msg{min-height:1.8em;font-size:15px;color:var(--deep)}
.ghost{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;font-size:14px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.match .col-title{font-size:13px;letter-spacing:.12em;color:var(--sub);font-weight:700}
.match .col{display:flex;flex-direction:column;gap:10px}
.m-item{position:relative;min-height:52px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);text-align:left;cursor:pointer;line-height:1.55}
.m-item.left{font-family:var(--serif);font-size:17px;color:var(--deep)}
.m-item[aria-pressed="true"]{border-color:var(--main);box-shadow:inset 0 0 0 2px var(--main)}
.m-item.done{background:var(--soft);border-color:var(--main);cursor:default}
.m-item.done::before{content:attr(data-n);position:absolute;top:-8px;left:-8px;width:22px;height:22px;border-radius:50%;background:var(--main);color:#fff;font-size:12px;font-family:var(--sans);display:flex;align-items:center;justify-content:center}
.m-item.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.c-item{min-height:48px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;font-family:var(--serif);font-size:17px;color:var(--deep);text-align:left}
.c-item[aria-pressed="true"]{border-color:var(--main);box-shadow:inset 0 0 0 2px var(--main)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.bucket{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.bucket-btn{display:block;width:100%;min-height:48px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:var(--soft);text-align:left;cursor:pointer;font-weight:700;color:var(--deep)}
.bucket-btn small{display:block;font-weight:400;color:var(--sub);font-size:13px}
.bucket ul{list-style:none;margin:0;padding:6px 14px 10px}
.bucket li{padding:6px 0;border-bottom:1px dashed var(--line);font-family:var(--serif);color:var(--deep)}
.bucket li:last-child{border-bottom:0}
.bucket li small{display:block;font-family:var(--sans);font-size:13px;color:var(--sub)}

/* Quiz */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 16px;margin-bottom:14px}
.q-meta{display:flex;gap:12px;font-size:13px;color:var(--sub);margin-bottom:6px}
.q-meta .tag{color:var(--main);font-weight:700}
.q-stem{margin:0 0 12px;font-size:17px;line-height:1.8}
.q-stem .blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--main);text-align:center;color:var(--deep);font-weight:700;padding:0 4px}
.opts{display:grid;gap:8px}
.opts.chips{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);text-align:left;cursor:pointer;line-height:1.6}
.opt .k{flex:none;font-weight:700;color:var(--main)}
.opt:hover:not([disabled]){border-color:var(--main)}
.opt[disabled]{cursor:default}
.opt.correct{background:#e8f0ea;border-color:var(--ok)}
.opt.correct .k{color:var(--ok)}
.opt.wrong{background:#f6e7e4;border-color:var(--ng)}
.opt.wrong .k{color:var(--ng)}
.opt.dim{opacity:.55}
.explain{display:none;margin-top:12px;padding:12px 14px;border-radius:6px;background:var(--soft);font-size:15px}
.explain.show{display:block}
.explain .v{font-weight:700;margin-right:6px}
.explain .v.ok{color:var(--ok)}
.explain .v.ng{color:var(--ng)}
.result{display:none;text-align:center;padding:26px 20px}
.result.show{display:block}
.result .big{font-family:var(--serif);font-size:40px;font-weight:900;color:var(--deep)}
.primary{min-height:48px;padding:0 22px;border:0;border-radius:6px;background:var(--deep);color:#fff;cursor:pointer;font-size:15px;margin-top:10px}

/* Related & footer */
.related a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-decoration:none;margin-bottom:10px}
.related a b{font-family:var(--serif);font-size:18px;color:var(--deep)}
.related a span{display:block;font-size:14px;color:var(--sub)}
footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:13px;color:var(--sub);line-height:1.7}

@media (max-width:640px){
  .card,.q{padding:18px 16px 14px}
  .src{font-size:19px;line-height:2.3}
  .facts{grid-template-columns:1fr;gap:0}
  .facts dt{margin-top:8px}
  .tr-row{grid-template-columns:1fr;gap:2px}
  .match{grid-template-columns:1fr}
  .match .col.right{margin-top:8px}
  .data-table thead{display:none}
  .data-table,.data-table tbody,.data-table tr,.data-table td{display:block;width:100%}
  .data-table tr{border-bottom:1px solid var(--line);padding:6px 0}
  .data-table td{border:0;padding:4px 12px}
  .data-table td::before{content:attr(data-label);display:block;font-size:12px;color:var(--sub);font-family:var(--sans);font-weight:400}
  .controls .score{margin-left:0;width:100%;text-align:right}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<!-- ===== ENGINE:STYLE END ===== -->
</head>

        b.setAttribute('aria-expanded', 'false');
        if (!b.dataset.note && window.console) console.warn('缺少注釋：' + key);
        into.appendChild(b);
      } else {
        var r = el('span'); r.innerHTML = rubyHtml(m[2], m[3]); into.appendChild(r.firstChild);
      }
      last = re.lastIndex;
    }
    if (last < src.length) into.appendChild(document.createTextNode(src.slice(last)));
  }
  if (D.text) {
    var T = D.text, s2 = section('text', T);
    T.paragraphs.forEach(function (p, i) {
      var c = el('article', 'card');
      var ph = el('div', 'para-head'); ph.appendChild(el('span', 'num', String(i + 1)));
      ph.appendChild(el('span', null, p.label || ('第 ' + (i + 1) + ' 段')));
      c.appendChild(ph);
      var src = el('p', 'src');
      p.sentences.forEach(function (s) { inline(s.src, p.notes, src); });
      c.appendChild(src);
      var tb = el('button', 'tr-btn', '逐句語譯'); tb.type = 'button'; tb.setAttribute('aria-expanded', 'false');
      var list = el('div', 'tr-list'); list.id = 'tr-' + i; tb.setAttribute('aria-controls', list.id);
      p.sentences.forEach(function (s) {
        var row = el('div', 'tr-row');
        var a = el('div', 'tr-src'); a.innerHTML = rich(s.src.replace(/\[|\]/g, ''));
        var b = el('div', 'tr-txt'); b.innerHTML = rich(s.tr);
        row.appendChild(a); row.appendChild(b); list.appendChild(row);
      });
      tb.addEventListener('click', function () {
        var open = !list.classList.contains('open');
        list.classList.toggle('open', open); tb.setAttribute('aria-expanded', open ? 'true' : 'false');
        tb.textContent = open ? '收起語譯' : '逐句語譯';
      });
      c.appendChild(tb); c.appendChild(list);
      s2.appendChild(c);
    });
    main.appendChild(s2);
  }

  /* ---------- 注釋提示框 ---------- */
  var openBtn = null, openY = 0;
  function closePop() { pop.classList.remove('show'); if (openBtn) openBtn.setAttribute('aria-expanded', 'false'); openBtn = null; }
  function placePop(b) {
    var r = b.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = Math.min(Math.max(12, r.left), window.innerWidth - pw - 12);
    var top = r.bottom + 8; if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 8);
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.annot');
    if (!b) { if (!e.target.closest || !e.target.closest('#pop')) closePop(); return; }
    if (openBtn === b) { closePop(); return; }
    closePop();
    pop.innerHTML = '<b>' + esc(b.dataset.term) + '</b>' + rich(b.dataset.note || '（注釋待補）');
    pop.classList.add('show'); placePop(b);
    b.setAttribute('aria-expanded', 'true'); openBtn = b; openY = window.scrollY;
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePop(); });
  // 小幅捲動時讓提示框跟著詞走；捲離較遠才關閉
  window.addEventListener('scroll', function () {
    if (!openBtn) return;
    if (Math.abs(window.scrollY - openY) > 120) closePop(); else placePop(openBtn);
  }, { passive: true });
  window.addEventListener('resize', closePop);

  /* ---------- 字詞整理 ---------- */
  if (D.words) {
    var W = D.words, s3 = section('words', W);
    (W.tables || []).forEach(function (t) {
      var box = el('div', 'table-box');
      if (t.caption) box.appendChild(el('h3', null, t.caption));
      var tbl = el('table', 'data-table'), th = el('thead'), tr = el('tr');
      t.head.forEach(function (x) { tr.appendChild(el('th', null, x)); });
      th.appendChild(tr); tbl.appendChild(th);
      var tb = el('tbody');
      t.rows.forEach(function (row) {
        var r = el('tr');
        row.forEach(function (cell, ci) { var td = el('td'); td.innerHTML = rich(cell); td.setAttribute('data-label', t.head[ci]); r.appendChild(td); });
        tb.appendChild(r);
      });
      tbl.appendChild(tb); box.appendChild(tbl); s3.appendChild(box);
    });
    (W.boxes || []).forEach(function (bx) {
      var d = el('div', bx.kind === 'trap' ? 'trap' : 'note');
      d.innerHTML = '<b class="t">' + esc(bx.title) + '</b>' + rich(bx.text);
      s3.appendChild(d);
    });
    main.appendChild(s3);
  }

  /* ---------- 量身探索 ---------- */
  function exploreMatch(X, host) {
    var st = el('div', 'explore-status'), msg = el('div', 'explore-msg'); msg.setAttribute('aria-live', 'polite');
    var prog = el('span'), reset = el('button', 'ghost', '重新配對'); reset.type = 'button';
    st.appendChild(prog); st.appendChild(reset);
    var grid = el('div', 'match'), L = el('div', 'col left'), R = el('div', 'col right');
    L.appendChild(el('div', 'col-title', X.left)); R.appendChild(el('div', 'col-title', X.right));
    grid.appendChild(L); grid.appendChild(R);
    host.appendChild(st); host.appendChild(msg); host.appendChild(grid);
    var sel = null, done = 0, count = 0, btns = [];
    function mk(text, side, idx) {
      var b = el('button', 'm-item ' + side); b.type = 'button'; b.innerHTML = rich(text);
      b.dataset.side = side; b.dataset.idx = idx; b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { pick(b); }); btns.push(b); return b;
    }
    function build() {
      btns = []; sel = null; done = 0; count = 0;
      L.querySelectorAll('.m-item').forEach(function (n) { n.remove(); });
      R.querySelectorAll('.m-item').forEach(function (n) { n.remove(); });
      X.pairs.forEach(function (p, i) { L.appendChild(mk(p[0], 'left', i)); });
      shuffle(X.pairs.map(function (p, i) { return i; }), D.slug + '-match').forEach(function (i) { R.appendChild(mk(X.pairs[i][1], 'right', i)); });
      prog.textContent = '已配對 0 / ' + X.pairs.length; msg.textContent = X.hint || '先點左邊一項，再點右邊對應的一項。';
    }
    function pick(b) {
      if (b.classList.contains('done')) return;
      if (!sel || sel.dataset.side === b.dataset.side) {
        if (sel) sel.setAttribute('aria-pressed', 'false');
        sel = (sel === b) ? null : b; if (sel) sel.setAttribute('aria-pressed', 'true'); return;
      }
      if (sel.dataset.idx === b.dataset.idx) {
        count++; [sel, b].forEach(function (n) { n.classList.add('done'); n.setAttribute('aria-pressed', 'false'); n.dataset.n = count; n.setAttribute('aria-disabled', 'true'); });
        done++; prog.textContent = '已配對 ' + done + ' / ' + X.pairs.length;
        var why = X.pairs[+b.dataset.idx][2]; msg.innerHTML = why ? '配對成功：' + rich(why) : '配對成功。';
        if (done === X.pairs.length) msg.innerHTML = rich(X.done || '全部配對完成！');
      } else {
        [sel, b].forEach(function (n) { n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); n.setAttribute('aria-pressed', 'false'); });
        msg.textContent = '這兩項不是一組，再看一次字面意思。';
      }
      sel = null;
    }
    reset.addEventListener('click', build); build();
  }
  function exploreClassify(X, host) {
    var st = el('div', 'explore-status'), msg = el('div', 'explore-msg'); msg.setAttribute('aria-live', 'polite');
    var prog = el('span'), reset = el('button', 'ghost', '重新分類'); reset.type = 'button';
    st.appendChild(prog); st.appendChild(reset);
    var pool = el('div', 'pool'), bk = el('div', 'buckets');
    host.appendChild(st); host.appendChild(pool); host.appendChild(msg); host.appendChild(bk);
    var sel = null, done = 0, lists = [];
    function build() {
      pool.innerHTML = ''; bk.innerHTML = ''; lists = []; sel = null; done = 0;
      X.categories.forEach(function (c, ci) {
        var box = el('div', 'bucket'), btn = el('button', 'bucket-btn'); btn.type = 'button';
        btn.innerHTML = esc(c.name) + (c.desc ? '<small>' + rich(c.desc) + '</small>' : '');
        btn.addEventListener('click', function () { drop(ci); });
        var ul = el('ul'); lists.push(ul); box.appendChild(btn); box.appendChild(ul); bk.appendChild(box);
      });
      shuffle(X.items.map(function (x, i) { return i; }), D.slug + '-classify').forEach(function (i) {
        var b = el('button', 'c-item'); b.type = 'button'; b.innerHTML = rich(X.items[i].text); b.dataset.i = i; b.setAttribute('aria-pressed', 'false');
        b.addEventListener('click', function () { if (sel) sel.setAttribute('aria-pressed', 'false'); sel = (sel === b) ? null : b; if (sel) sel.setAttribute('aria-pressed', 'true'); });
        pool.appendChild(b);
      });
      prog.textContent = '已分類 0 / ' + X.items.length; msg.textContent = X.hint || '先點一句，再點它所屬的類別。';
    }
    function drop(ci) {
      if (!sel) { msg.textContent = '先點上方的一句，再選類別。'; return; }
      var it = X.items[+sel.dataset.i];
      if (it.cat === ci) {
        var li = el('li'); li.innerHTML = rich(it.text) + (it.why ? '<small>' + rich(it.why) + '</small>' : '');
        lists[ci].appendChild(li); sel.remove(); sel = null; done++;
        prog.textContent = '已分類 ' + done + ' / ' + X.items.length;
        msg.innerHTML = done === X.items.length ? rich(X.done || '全部分類完成！') : '放對了。';
      } else {
        sel.classList.remove('shake'); void sel.offsetWidth; sel.classList.add('shake');
        msg.innerHTML = '不是這一類。' + (it.hint ? '提示：' + rich(it.hint) : '再讀一次這句在寫什麼。');
      }
    }
    reset.addEventListener('click', build); build();
  }
  if (D.explore) {
    var X = D.explore, s4 = section('explore', X), host = el('div', 'card');
    if (X.type === 'match') exploreMatch(X, host);
    else if (X.type === 'classify') exploreClassify(X, host);
    s4.appendChild(host); main.appendChild(s4);
  }

  /* ---------- 綜合自我測驗 ---------- */
  var Q = D.quiz && D.quiz.items || [], right = 0, answered = 0;
  function updateScore() {
    scoreBox.innerHTML = Q.length ? '測驗　答對 <b>' + right + '</b>｜已作答 ' + answered + ' / ' + Q.length : '';
  }
  if (Q.length) {
    var s5 = section('quiz', D.quiz), box = el('div'), res = el('div', 'card result');
    s5.appendChild(box); s5.appendChild(res); main.appendChild(s5);
    var KEYS = ['A', 'B', 'C', 'D', 'E'];
    function renderQuiz() {
      box.innerHTML = ''; right = 0; answered = 0; res.classList.remove('show'); updateScore();
      Q.forEach(function (it, qi) {
        var c = el('div', 'q'); c.id = 'q-' + it.id;
        var meta = el('div', 'q-meta');
        meta.appendChild(el('span', null, '第 ' + (qi + 1) + ' 題 / ' + Q.length));
        meta.appendChild(el('span', 'tag', it.tag || ''));
        c.appendChild(meta);
        var stem = el('p', 'q-stem');
        var BL = '＿＿';
        if (it.type === 'cloze' && it.q.indexOf(BL) > -1) {
          var parts = it.q.split(BL);
          stem.innerHTML = rich(parts[0]) + '<span class="blank">？</span>' + rich(parts.slice(1).join(BL));
        } else stem.innerHTML = rich(it.q);
        c.appendChild(stem);
        var opts = el('div', 'opts' + (it.type === 'cloze' ? ' chips' : ''));
        var order = shuffle(it.options.map(function (o, i) { return i; }), D.slug + '-' + it.id);
        var exp = el('div', 'explain'); exp.setAttribute('aria-live', 'polite');
        order.forEach(function (oi, pos) {
          var b = el('button', 'opt'); b.type = 'button';
          b.innerHTML = '<span class="k">' + KEYS[pos] + '</span><span>' + rich(it.options[oi]) + '</span>';
          b.dataset.oi = oi;
          b.addEventListener('click', function () {
            var ok = oi === it.answer; answered++; if (ok) right++;
            opts.querySelectorAll('.opt').forEach(function (o) {
              o.disabled = true;
              if (+o.dataset.oi === it.answer) o.classList.add('correct');
              else if (o === b) o.classList.add('wrong'); else o.classList.add('dim');
            });
            if (it.type === 'cloze') stem.querySelector('.blank').innerHTML = rich(it.options[it.answer]);
            exp.innerHTML = '<span class="v ' + (ok ? 'ok">答對了' : 'ng">再想想') + '</span>' + rich(it.explain);
            exp.classList.add('show'); updateScore();
            if (answered === Q.length) showResult();
          });
          opts.appendChild(b);
        });
        c.appendChild(opts); c.appendChild(exp); box.appendChild(c);
      });
    }
    function showResult() {
      var ratio = right / Q.length;
      var m = ratio === 1 ? '全對！這篇的觀念已經很穩，可以挑戰下一篇。' : ratio >= .7 ? '大部分都掌握了，回頭看看答錯題的詳解就更完整。' : '先回到課文和字詞整理再讀一次，再重新測驗會更有感。';
      res.innerHTML = '<div class="big">' + right + ' / ' + Q.length + '</div><p>' + m + '</p>';
      var again = el('button', 'primary', '重新測驗'); again.type = 'button';
      again.addEventListener('click', function () { renderQuiz(); document.getElementById('quiz').scrollIntoView(); });
      res.appendChild(again); res.classList.add('show');
    }
    renderQuiz();
  }

  /* ---------- 延伸閱讀與頁尾 ---------- */
  if (D.related && D.related.length) {
    var s6 = section('related', { kicker: 'NEXT', title: '接著讀' }), rl = el('div', 'related');
    D.related.forEach(function (r) {
      var a = el('a'); a.href = '../' + r.slug + '/';
      a.innerHTML = '<b>' + esc(r.title) + '</b><span>' + rich(r.why) + '</span>';
      rl.appendChild(a);
    });
    s6.appendChild(rl); main.appendChild(s6);
  }
  var ft = el('footer'), fw = el('div', 'wrap');
  fw.innerHTML = rich(D.footer || '') + (D.textbook ? '<br>課本對應：' + rich(D.textbook) : '');
  ft.appendChild(fw); app.appendChild(ft);
})();
</script>
